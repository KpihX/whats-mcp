name: whats-mcp

services:
  whats-mcp:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: whats-mcp
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    volumes:
      - whats_mcp_data:/data
    networks:
      - proxy
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://127.0.0.1:8092/health').then((r) => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      # --- Activation Traefik ---
      - "traefik.enable=true"

      # --- Routes Hybrides (Interne + Public) ---
      # Accès interne via Tailscale (.homelab) + Accès public via Cloudflare (.kpihx-labs.com)
      - "traefik.http.routers.whats-mcp.rule=Host(`whats.homelab`) || Host(`whats.kpihx-labs.com`)"
      - "traefik.http.routers.whats-mcp.entrypoints=websecure"
      - "traefik.http.routers.whats-mcp.tls=true"
      - "traefik.http.routers.whats-mcp.tls.certresolver=myresolver"

      # --- Sécurité (IP Allowlist + Cloudflare Access) ---
      # 1. Middleware Chain : IP Allowlist (Cloudflare IPs) + Headers
      - "traefik.http.routers.whats-mcp.middlewares=whats-mcp-security-chain"

      # 2. IP Allowlist (Seulement les IPs Cloudflare)
      - "traefik.http.middlewares.whats-mcp-ip-allowlist.ipwhitelist.sourcerange=10.0.0.0/8,173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,131.0.72.0/22"

      # 3. Headers de sécurité (existants)
      - "traefik.http.middlewares.whats-mcp-headers.headers.browserxssfilter=true"
      - "traefik.http.middlewares.whats-mcp-headers.headers.contenttypenosniff=true"
      - "traefik.http.middlewares.whats-mcp-headers.headers.framedeny=true"

      # 4. Chain Middleware (Ordre important : IP Allowlist -> Headers)
      - "traefik.http.middlewares.whats-mcp-security-chain.chain.middlewares=whats-mcp-ip-allowlist,whats-mcp-headers"

      # --- Service ---
      - "traefik.http.services.whats-mcp.loadbalancer.server.port=8092"

networks:
  proxy:
    external: true

volumes:
  whats_mcp_data:
    name: deploy_whats_mcp_data
